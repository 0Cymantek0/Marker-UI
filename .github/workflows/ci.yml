name: Backend & Frontend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "supervisord.conf"
      - "nginx.conf"
      - "pyproject.toml"
      - "start.ps1"
      - "start.sh"
      - ".github/workflows/ci.yml"
  push:
    branches: [master, main, markerui-v2]
  workflow_call:

jobs:
  backend:
    name: Dependency Truth & Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng ffmpeg

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-cpu.lock

      - name: Install locked dependencies (universal CPU lock, markers honored)
        run: |
          pip install --upgrade pip uv
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r backend/requirements-cpu.lock
          pip install -r backend/requirements-dev.txt

      - name: Verify lockfile synchronization (fail-closed drift gate)
        run: |
          python backend/scripts/lock_dependencies.py --check

      - name: Run Phase 0 Dependency & Build Truth tests
        working-directory: backend
        run: |
          python -m pytest tests/test_dependency_truth.py tests/test_dockerfile.py -v

      - name: Migration authority gate (Alembic sole schema authority)
        working-directory: backend
        run: |
          python -m pytest tests/test_database_migration.py -v

      - name: Run full backend test suite
        working-directory: backend
        run: |
          python -m pytest tests conformance -q

      - name: Verify build provenance and runtime lock inspection
        working-directory: backend
        run: |
          python -m app.cli provenance --verify

  frontend:
    name: Frontend Lint, Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 22 with pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm run lint

      - name: Tests
        working-directory: frontend
        run: pnpm run test

      - name: Production build (tsc + vite)
        working-directory: frontend
        run: pnpm run build

  canonical-conformance:
    name: Canonical Identity Conformance (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest only (suite is stdlib + pytest)
        run: pip install pytest==8.3.4

      - name: Run canonical identity conformance suite
        working-directory: backend
        run: python -m pytest conformance -q

  industrial-persistence:
    name: Industrial Persistence Conformance (PostgreSQL + S3)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marker
          POSTGRES_PASSWORD: marker
          POSTGRES_DB: postgres
        ports:
          - 55445:5432
        # Health checks fail the job before tests start if the real
        # server never becomes reachable — no skip path exists.
        options: >-
          --health-cmd "pg_isready -U marker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: marker
          MINIO_ROOT_PASSWORD: marker-marker
        ports:
          - 55446:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-cpu.lock

      - name: Install locked dependencies (universal CPU lock, markers honored)
        run: |
          pip install --upgrade pip uv
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r backend/requirements-cpu.lock
          pip install -r backend/requirements-dev.txt

      - name: Run strict industrial matrix (real PostgreSQL + real S3, no skips)
        working-directory: backend
        env:
          MARKER_TEST_POSTGRES_ADMIN_URL: postgresql+asyncpg://marker:marker@127.0.0.1:55445/postgres
          MARKER_TEST_POSTGRES_STRICT: "1"
          MARKER_TEST_S3_ENDPOINT: http://127.0.0.1:55446
          MARKER_TEST_S3_ACCESS_KEY: marker
          MARKER_TEST_S3_SECRET_KEY: marker-marker
          MARKER_TEST_S3_STRICT: "1"
        run: |
          set -o pipefail
          python -m pytest \
            tests/test_kernel_dual_backend_conformance.py \
            tests/test_kernel_control_plane_conformance.py \
            tests/test_kernel_materialization_conformance.py \
            tests/test_kernel_runtime.py \
            tests/test_kernel_dialects.py \
            tests/test_payload_store_conformance.py \
            tests/test_payload_store_s3.py \
            tests/test_kernel_lifecycle_conformance.py \
            tests/test_kernel_publication_lexical_conformance.py \
            tests/test_context_runtime_lexical_conformance.py \
            tests/test_source_store_conformance.py \
            tests/test_source_store_s3.py \
            tests/test_kernel_source_acquisition_s3.py \
            tests/test_kernel_source_runtime_s3.py \
            tests/test_kernel_source_industrial_topology.py \
            tests/test_kernel_recovery_point.py \
            tests/test_kernel_recovery_restore.py \
            tests/test_kernel_recovery_failover.py \
            -q -rs --no-header | tee pytest-industrial.out

      - name: "Guard: fail on any skip in the industrial matrix"
        working-directory: backend
        run: |
          if grep -Eq '[0-9]+ skipped\b' pytest-industrial.out; then
            echo "ERROR: industrial matrix reported skipped tests" >&2
            exit 1
          fi
          echo "no skips: industrial matrix executed every parameter"

  industrial-failover:
    name: Industrial Failover Conformance (two-node PostgreSQL promotion)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # No service containers: the runner provisions (and the drills
    # control) the real services through Docker — the two-node
    # PostgreSQL topology, the hard kill, and the pg_promote are the
    # test subject itself and cannot be provided as a passive service.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-cpu.lock

      - name: Install locked dependencies (universal CPU lock, markers honored)
        run: |
          pip install --upgrade pip uv
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r backend/requirements-cpu.lock
          pip install -r backend/requirements-dev.txt

      - name: Run strict failover matrix (real primary/standby promotion, no skips)
        working-directory: backend
        run: |
          set -o pipefail
          python scripts/run_failover_conformance.py 2>&1 | tee pytest-failover.out

      - name: "Guard: fail on any skip in the failover matrix"
        working-directory: backend
        run: |
          if grep -Eq '[0-9]+ skipped\b' pytest-failover.out; then
            echo "ERROR: failover matrix reported skipped tests" >&2
            exit 1
          fi
          echo "no skips: failover matrix executed every parameter"
