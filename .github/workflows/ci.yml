name: Backend & Frontend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "supervisord.conf"
      - "nginx.conf"
      - "pyproject.toml"
      - "start.ps1"
      - "start.sh"
      - ".github/workflows/ci.yml"
  push:
    branches: [master, main, markerui-v2]
  workflow_call:

jobs:
  backend:
    name: Dependency Truth & Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng ffmpeg

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-cpu.lock

      - name: Install locked dependencies (universal CPU lock, markers honored)
        run: |
          pip install --upgrade pip uv
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r backend/requirements-cpu.lock

      - name: Verify lockfile synchronization (fail-closed drift gate)
        run: |
          python backend/scripts/lock_dependencies.py --check

      - name: Run Phase 0 Dependency & Build Truth tests
        working-directory: backend
        run: |
          python -m pytest tests/test_dependency_truth.py tests/test_dockerfile.py -v

      - name: Run full backend test suite
        working-directory: backend
        run: |
          python -m pytest tests -q

      - name: Verify build provenance and runtime lock inspection
        working-directory: backend
        run: |
          python -m app.cli provenance --verify

  frontend:
    name: Frontend Lint, Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 22 with pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm run lint

      - name: Tests
        working-directory: frontend
        run: pnpm run test

      - name: Production build (tsc + vite)
        working-directory: frontend
        run: pnpm run build
