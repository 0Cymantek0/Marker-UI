# Security model:
# - supervisord runs as root (required to manage nginx binding to port 80)
# - nginx master runs as root, worker processes drop to nobody (default nginx behavior)
# - uvicorn (backend) drops to appuser via user= directive
# - HOME/HF_HOME/TRANSFORMERS_CACHE are set explicitly so appuser can write model
#   weights to a volume-backed cache. Without HOME, supervisord inherits HOME=/root
#   from the root parent and HF writes to /root/.cache → PermissionError (D3).
# - HEALTHCHECK uses curl against nginx on localhost:80

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:backend]
# Alembic is the sole persistent schema authority: migrate to head before
# Uvicorn starts (the app itself only validates, never repairs, schema).
command=sh -c "python -m app.db_migration upgrade && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
directory=/app/backend
user=appuser
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",HOME="/app",HF_HOME="/app/backend/data/huggingface",TRANSFORMERS_CACHE="/app/backend/data/huggingface"

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
